name: Publish Prebuilt Debug APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - "apk-distribution/app-debug.apk"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    name: Publish Prebuilt Debug APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate prebuilt APK and checksum
        id: validate
        run: |
          set -euo pipefail

          APK_PATH="apk-distribution/app-debug.apk"
          SHA_PATH="apk-distribution/app-debug.apk.sha256"

          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "Error: $APK_PATH is missing or empty." >&2
            exit 1
          fi

          if [ ! -f "$SHA_PATH" ]; then
            echo "Error: $SHA_PATH is missing." >&2
            exit 1
          fi

          (cd apk-distribution && sha256sum -c app-debug.apk.sha256)
          unzip -tq "$APK_PATH"

          ACTUAL_SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
          APK_BYTES=$(stat -c '%s' "$APK_PATH")
          APK_HUMAN=$(ls -lh "$APK_PATH" | awk '{print $5}')

          echo "sha256=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$APK_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_human=$APK_HUMAN" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_SIZE_HUMAN: ${{ steps.validate.outputs.size_human }}
          APK_SIZE_BYTES: ${{ steps.validate.outputs.size_bytes }}
          APK_SHA256: ${{ steps.validate.outputs.sha256 }}
        run: |
          set -euo pipefail

          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          NOTES=$(printf 'Prebuilt debug APK compiled in Google AI Studio.\n\n- **Asset:** `app-debug.apk`\n- **Size:** %s (%s bytes)\n- **SHA-256:** `%s`\n' \
            "$APK_SIZE_HUMAN" "$APK_SIZE_BYTES" "$APK_SHA256")

          RELEASE_URL=$(gh release create "$TAG" \
            "apk-distribution/app-debug.apk" \
            --title "Debug APK Build ${GITHUB_RUN_NUMBER} (Attempt ${GITHUB_RUN_ATTEMPT})" \
            --notes "$NOTES" \
            --latest)

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: success()
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          APK_SIZE_HUMAN: ${{ steps.validate.outputs.size_human }}
          APK_SIZE_BYTES: ${{ steps.validate.outputs.size_bytes }}
          APK_SHA256: ${{ steps.validate.outputs.sha256 }}
        run: |
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
          {
            echo "## Prebuilt Debug APK Published"
            echo ""
            echo "- **Release Tag:** \`${RELEASE_TAG}\`"
            echo "- **APK Size:** ${APK_SIZE_HUMAN} (${APK_SIZE_BYTES} bytes)"
            echo "- **SHA-256:** \`${APK_SHA256}\`"
            echo "- **GitHub Release Page:** ${RELEASE_URL}"
            echo "- **Direct Latest APK Download:** ${DIRECT_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
